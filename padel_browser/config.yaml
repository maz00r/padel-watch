name: Padel (Decathlon) — monitor + logowanie
version: "0.24.0"
slug: padel_browser
description: Monitoruje wolne terminy padla i (opcjonalnie) rejestruje automatycznie. Logujesz się raz w panelu, dodatek sam podtrzymuje sesję i token.
url: https://github.com/maz00r/padel-watch
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:tennis
panel_title: Padel
options:
  ntfy_topic: "your-ntfy-topic-here"
  check_interval: 60
  log_level: "info"
  filters: "mon-fri:15:00-02:00; sat-sun:00:00-24:00"
  intervals: ""
  burst: "mon-sun:11:00:45"
  burst_seconds: 15
  burst_interval: 0.2
  sprint: "mon-sun:11:00:05"
  sprint_seconds: 40
  sprint_threads: 3
  token_check_before: 30
  auto_login: true
  remote_url: ""
  remote_secret: ""
  listing_url: "https://go.decathlon.pl/l/1c0ec93e-ca77-44b9-a3a6-c72a99d050dd"
  timezone: "Europe/Warsaw"
  auto_register: false
  auto_register_dry_run: true
  auto_register_name: ""
  auto_register_age: ""
  auto_register_paid: false
  auto_register_max: 1
  auto_register_order: "latest"
  auto_register_salvo: 6
  auto_register_lead: false
  auto_register_hedge: 2
  auto_register_stagger: 8
  clear_state: ""
  test_token: false
  start_url: "https://go.decathlon.pl"
  read_interval: 300
  decathlon_token: ""
  decathlon_cookie: ""
schema:
  ntfy_topic: str
  check_interval: int(10,3600)
  log_level: list(debug|info|warn|error)
  filters: str?
  intervals: str?
  burst: str?
  burst_seconds: int(1,120)
  burst_interval: float
  sprint: str?
  sprint_seconds: int(1,60)
  sprint_threads: int(1,4)
  token_check_before: int(0,240)
  auto_login: bool
  remote_url: str?
  remote_secret: password?
  listing_url: url
  timezone: str
  auto_register: bool
  auto_register_dry_run: bool
  auto_register_name: str?
  auto_register_age: str?
  auto_register_paid: bool
  auto_register_max: int(0,10)
  auto_register_order: list(earliest|latest)
  auto_register_salvo: int(0,6)
  auto_register_lead: bool
  auto_register_hedge: int(1,3)
  auto_register_stagger: int(0,100)
  clear_state: list(|registered|all)
  test_token: bool
  start_url: url
  read_interval: int(60,3600)
  decathlon_token: str?
  decathlon_cookie: str?
