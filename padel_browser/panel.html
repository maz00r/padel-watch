<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padel</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --fg:#1b1d20; --muted:#6a7180; --line:#e3e6ea;
    --accent:#0b7ddb; --danger:#c62828; --ok:#177245; --warn:#8a6100;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15181c; --card:#1e2228; --fg:#e8eaed; --muted:#9aa2af; --line:#2c313a;
            --accent:#4da3ff; --danger:#ef6a6a; --ok:#5fbf85; --warn:#e0b352; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--fg); }
  header { display:flex; gap:6px; padding:10px 12px; border-bottom:1px solid var(--line);
           background:var(--card); position:sticky; top:0; z-index:5; }
  .tab { flex:1; padding:9px 12px; border:0; border-radius:9px; font:inherit; font-weight:600;
         background:transparent; color:var(--muted); cursor:pointer; }
  .tab[aria-selected="true"] { background:var(--accent); color:#fff; }
  main { padding:12px; max-width:760px; margin:0 auto; }
  #browser { padding:0; max-width:none; }
  .bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .bar .grow { flex:1; }
  button, .btn { font:inherit; border-radius:9px; border:1px solid var(--line);
                 background:var(--card); color:var(--fg); padding:8px 12px; cursor:pointer;
                 text-decoration:none; display:inline-block; }
  button:hover, .btn:hover { border-color:var(--accent); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.danger { color:var(--danger); border-color:transparent; }
  .btn.danger:hover { border-color:var(--danger); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:12px 14px; margin-bottom:10px; }
  .card.dim { opacity:.6; }
  .when { font-size:19px; font-weight:700; }
  .sub { color:var(--muted); font-size:13px; margin-top:2px; }
  .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .badge { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px;
           border:1px solid currentColor; white-space:nowrap; flex:0 0 auto; }
  .badge.ok { color:var(--ok); } .badge.off { color:var(--muted); }
  .badge.warn { color:var(--warn); } .badge.bad { color:var(--danger); }
  .row { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .row > div { min-width:0; }   /* tekst ma się zawijać, a nie rozpychać plakietkę */
  .msg { padding:12px 14px; border-radius:12px; border:1px solid var(--line);
         background:var(--card); }
  .msg.error { border-color:var(--danger); color:var(--danger); }
  .empty { color:var(--muted); text-align:center; padding:28px 10px; }
  details { margin-top:18px; color:var(--muted); font-size:13px; }
  pre { overflow:auto; background:var(--card); border:1px solid var(--line);
        border-radius:9px; padding:10px; max-height:340px; font-size:12px; }
  iframe { display:block; width:100%; height:calc(100vh - 57px); border:0; }
  .hide { display:none !important; }
</style>
</head>
<body>
<header>
  <button class="tab" id="tab-res" aria-selected="true" onclick="showTab('res')">Rezerwacje</button>
  <button class="tab" id="tab-hunts" aria-selected="false" onclick="showTab('hunts')">Polowania</button>
  <button class="tab" id="tab-browser" aria-selected="false" onclick="showTab('browser')">Przeglądarka</button>
</header>

<main id="res">
  <div class="bar">
    <button class="btn primary" onclick="load(true)">Odśwież</button>
    <a class="btn" id="all-ics" href="cal/all.ics">Wszystkie do kalendarza</a>
    <span class="grow"></span>
    <label class="sub"><input type="checkbox" id="show-past" onchange="render()"> minione</label>
    <label class="sub"><input type="checkbox" id="show-cancelled" onchange="render()"> anulowane</label>
  </div>
  <div id="status" class="msg">Wczytuję rezerwacje…</div>
  <div id="list"></div>
  <details>
    <summary>Diagnostyka (surowa odpowiedź Decathlon GO)</summary>
    <p>Przydatne, gdy rezerwacja wyświetla się niekompletnie — pokazuje, co dokładnie zwrócił serwer.</p>
    <button onclick="loadRaw()">Pobierz surowe dane</button>
    <pre id="raw" class="hide"></pre>
  </details>
</main>

<main id="hunts" class="hide">
  <div class="bar">
    <button class="btn primary" onclick="loadHunts()">Odśwież</button>
    <span class="sub grow">Jeden wpis na dobę. Dni wymagające uwagi są oznaczone.</span>
  </div>
  <div id="hunts-status" class="msg">Wczytuję dziennik…</div>
  <div id="hunts-list"></div>
</main>

<main id="browser" class="hide"></main>

<script>
// Panel działa pod prefiksem Ingressu (/api/hassio_ingress/<token>/), dlatego
// WSZYSTKIE adresy są względne — przeglądarka sama doklei właściwy prefiks.
var reservations = [];

function showTab(name) {
  ["res", "hunts", "browser"].forEach(function (id) {
    document.getElementById(id).classList.toggle("hide", id !== name);
    document.getElementById("tab-" + id).setAttribute("aria-selected", String(id === name));
  });
  if (name === "browser") mountBrowser();
  if (name === "hunts" && !huntsLoaded) loadHunts();
}

// ------------------------------------------------------------ dziennik polowań
// Sens tej zakładki: najważniejsze liczby z sekundy publikacji giną w tysiącach
// linii Dziennika dodatku. Tutaj są odłożone, jeden wpis na dobę, i widać na oko,
// czy dzień był w porządku — bez czytania czegokolwiek.
var huntsLoaded = false;

// Polski liczebnik: 1 / 2-4 / reszta, z wyjątkiem nastek. Ten sam podział co w silniku.
function odmien(n, one, few, many) {
  var last = n % 10, teens = n % 100;
  if (n === 1) return one;
  if (last >= 2 && last <= 4 && !(teens >= 12 && teens <= 14)) return few;
  return many;
}

function loadHunts() {
  var status = document.getElementById("hunts-status");
  status.className = "msg";
  status.textContent = "Wczytuję dziennik…";
  fetch("api/hunts", { headers: { "Accept": "application/json" } })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      huntsLoaded = true;
      if (!data.ok) throw new Error(data.error || "nieznany błąd");
      renderHunts(data.items || []);
      status.classList.add("hide");
    })
    .catch(function (e) {
      status.className = "msg bad";
      status.textContent = "Nie udało się wczytać dziennika: " + e.message;
    });
}

function huntShots(shots) {
  if (!shots || !shots.length) return "";
  var opis = shots.map(function (s) {
    var start = s.start_ms == null ? "" : "+" + s.start_ms + "\u2009ms \u2192 ";
    return esc(s.when) + " " + (s.ok ? "\u2713" : "\u2717") + " " + start + s.ms + "\u2009ms";
  }).join(" · ");
  return '<div class="sub">Strzały: ' + opis + "</div>";
}

function huntCard(h) {
  var uwaga = h.aligned === false || (!h.registered.length && h.failed.length);
  var naglowek = esc(h.date) + " · publikacja " + esc(h.first_seen)
    + (h.remote ? ' <span class="badge">Irlandia</span>' : "");
  var stan = uwaga
    ? '<span class="badge bad">wymaga uwagi</span>'
    : '<span class="badge ok">' + h.registered.length + " "
      + odmien(h.registered.length, "rezerwacja", "rezerwacje", "rezerwacji") + "</span>";
  var linie = [];
  if (h.total) {
    linie.push('<div class="sub">Grafik ' + esc(h.target_day || "") + ": "
      + h.free + " wolnych z " + h.total + "</div>");
  }
  if (h.registered.length) {
    linie.push('<div class="sub">Zdobyte: ' + esc(h.registered.join(", ")) + "</div>");
  }
  if (h.failed.length) {
    linie.push('<div class="sub">Przegrane: ' + h.failed.map(function (f) {
      return esc(f.when) + " (" + esc(f.why) + ")";
    }).join(", ") + "</div>");
  }
  if (h.never_seen && h.never_seen.length) {
    // Najważniejsza linia w całym dzienniku: godzina, której NIGDY nie zobaczyliśmy
    // jako wolnej, jest nie do wygrania żadną prędkością. To co innego niż przegrany
    // wyścig — tamte są wyżej, w „Przegrane".
    linie.push('<div class="sub bad">Nigdy nie pokazane jako wolne: '
      + esc(h.never_seen.join(", "))
      + " — te zniknęły przed naszym pierwszym spojrzeniem.</div>");
  }
  if (h.aligned === false) {
    linie.push('<div class="sub bad">Publikacja poza zrywem (' + esc(h.burst)
      + ") — przesuń okna w konfiguracji.</div>");
  }
  linie.push(huntShots(h.shots));
  return '<div class="card' + (uwaga ? "" : " dim") + '">'
    + "<div><b>" + naglowek + "</b> " + stan + "</div>" + linie.join("") + "</div>";
}

function renderHunts(items) {
  var host = document.getElementById("hunts-list");
  if (!items.length) {
    host.innerHTML = '<div class="msg">Jeszcze nic tu nie ma — pierwszy wpis pojawi się '
      + "po najbliższej publikacji grafiku.</div>";
    return;
  }
  host.innerHTML = items.map(huntCard).join("");
}

// noVNC buduje adres websocketu OD KORZENIA, więc 'path' musi zawierać prefiks
// Ingressu — składamy go z bieżącej ścieżki. Ramkę wstawiamy dopiero przy wejściu
// w zakładkę: obraz z Chromium to stały strumień, nie ma go po co ciągnąć w tle.
function mountBrowser() {
  var host = document.getElementById("browser");
  if (host.dataset.ready) return;
  var dir = location.pathname.replace(/[^/]*$/, "");
  var path = (dir + "websockify").replace(/^\/+/, "");
  var frame = document.createElement("iframe");
  frame.src = "vnc.html?autoconnect=true&reconnect=true&resize=scale&path=" + encodeURIComponent(path);
  host.appendChild(frame);
  host.dataset.ready = "1";
}

function esc(text) {
  return String(text == null ? "" : text).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function badge(res) {
  if (res.cancelled) return '<span class="badge bad">anulowana</span>';
  if (res.past) return '<span class="badge off">minęła</span>';
  if (res.state === "pending-payment") return '<span class="badge warn">czeka na płatność</span>';
  return '<span class="badge ok">potwierdzona</span>';
}

function card(res) {
  var sub = [res.title, res.address].filter(Boolean).map(esc).join(" · ");
  var who = res.participants && res.participants.length
    ? '<div class="sub">Uczestnicy: ' + esc(res.participants.join(", ")) + "</div>" : "";
  var actions = "";
  if (!res.cancelled && !res.past) {
    actions = '<div class="actions">'
      + '<a class="btn" href="cal/' + encodeURIComponent(res.id) + '.ics">Dodaj do kalendarza</a>'
      + '<button class="btn danger" onclick="cancelRes(\'' + esc(res.id) + '\')">Anuluj rezerwację</button>'
      + "</div>";
  } else if (res.cancelled && !res.past) {
    // Odwołany termin trzeba jeszcze usunąć z kalendarza — sam stamtąd nie zniknie.
    actions = '<div class="actions">'
      + '<a class="btn" href="cal/' + encodeURIComponent(res.id) + '.ics">Usuń z kalendarza</a>'
      + "</div>";
  }
  return '<div class="card' + (res.cancelled || res.past ? " dim" : "") + '">'
    + '<div class="row"><div>'
    + '<div class="when">' + esc(res.date_label || res.when) + "</div>"
    + '<div class="sub"><b>' + esc(res.hours) + "</b>" + (sub ? " · " + sub : "") + "</div>"
    + who
    + "</div>" + badge(res) + "</div>" + actions + "</div>";
}

// Domyślnie widać tylko to, co jeszcze przed Tobą: bez minionych i bez anulowanych.
// Wybór zapamiętujemy, żeby nie klikać go przy każdym wejściu w panel.
function filterState(name) {
  return document.getElementById("show-" + name).checked;
}

function restoreFilters() {
  ["past", "cancelled"].forEach(function (name) {
    try {
      document.getElementById("show-" + name).checked =
        localStorage.getItem("padel-show-" + name) === "1";
    } catch (e) { /* prywatny tryb przeglądarki — trudno, zostaje domyślne */ }
  });
}

// Polski ma trzy formy liczby mnogiej: 1 / 2-4 / reszta (z wyjątkiem nastek 12-14).
function hiddenCount(n) {
  var last = n % 10, teens = n % 100;
  if (n === 1) return "1 rezerwacja jest ukryta";
  if (last >= 2 && last <= 4 && (teens < 12 || teens > 14)) return n + " rezerwacje są ukryte";
  return n + " rezerwacji jest ukrytych";
}

function render() {
  var past = filterState("past");
  var cancelled = filterState("cancelled");
  try {
    localStorage.setItem("padel-show-past", past ? "1" : "0");
    localStorage.setItem("padel-show-cancelled", cancelled ? "1" : "0");
  } catch (e) { /* jw. */ }
  var shown = reservations.filter(function (r) {
    return (past || !r.past) && (cancelled || !r.cancelled);
  });
  var hidden = reservations.length - shown.length;
  var empty = hidden
    ? "Nic do pokazania — " + hiddenCount(hidden) + " filtrami powyżej."
    : "Brak nadchodzących rezerwacji.";
  document.getElementById("list").innerHTML = shown.length
    ? shown.map(card).join("")
    : '<div class="empty">' + empty + "</div>";
}

function status(text, isError) {
  var el = document.getElementById("status");
  el.textContent = text;
  el.className = "msg" + (isError ? " error" : "");
  el.classList.toggle("hide", !text);
}

// Wariant z linkiem w treści (np. „pobierz odwołanie do kalendarza").
// Wstawiamy tylko własny, zbudowany tutaj kod — nigdy tekstu z serwera.
function statusHtml(html) {
  var el = document.getElementById("status");
  el.innerHTML = html;
  el.className = "msg";
  el.classList.remove("hide");
}

function load(force) {
  status("Wczytuję rezerwacje…", false);
  // Zwracamy obietnicę: po anulowaniu dopisujemy do statusu link do kalendarza,
  // a musi to nastąpić PO odświeżeniu listy, żeby go nie nadpisało.
  return fetch("api/reservations" + (force ? "?refresh=1" : ""), { headers: { Accept: "application/json" } })
    .then(function (r) { return r.json(); })
    .then(function (doc) {
      if (!doc.ok) {
        // Przy błędzie sam komunikat — bez „brak rezerwacji" (nie wiemy tego)
        // i bez linku do kalendarza, który i tak nie miałby czego pobrać.
        reservations = [];
        document.getElementById("list").innerHTML = "";
        document.getElementById("all-ics").classList.add("hide");
        return status(doc.error, true);
      }
      reservations = doc.items;
      var upcoming = reservations.filter(function (r) { return !r.past && !r.cancelled; }).length;
      status("Nadchodzące rezerwacje: " + upcoming + " (stan na " + doc.generated + ")", false);
      document.getElementById("all-ics").classList.toggle("hide", upcoming === 0);
      render();
    })
    .catch(function (e) { status("Nie udało się pobrać danych: " + e, true); });
}

function cancelRes(id) {
  var res = reservations.filter(function (r) { return r.id === id; })[0];
  if (!res) return;
  var what = res.when + " (" + res.hours + ")\n" + (res.title || "");
  if (!confirm("Anulować rezerwację?\n\n" + what + "\n\nTej operacji nie da się cofnąć.")) return;
  status("Anuluję…", false);
  fetch("api/cancel", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: id })
  })
    .then(function (r) { return r.json(); })
    .then(function (doc) {
      if (!doc.ok) return status("Nie anulowano: " + doc.message, true);
      // Karta zaraz zniknie (anulowane są domyślnie ukryte), więc link do usunięcia
      // z kalendarza podajemy TERAZ — inaczej trzeba by go szukać pod przełącznikiem.
      load(true).then(function () {
        statusHtml('Anulowano. Termin nie zniknie sam z kalendarza — '
          + '<a href="cal/' + encodeURIComponent(id) + '.ics">pobierz odwołanie</a>.');
      });
    })
    .catch(function (e) { status("Nie udało się anulować: " + e, true); });
}

function loadRaw() {
  var pre = document.getElementById("raw");
  pre.classList.remove("hide");
  pre.textContent = "Pobieram…";
  fetch("api/raw")
    .then(function (r) { return r.json(); })
    .then(function (doc) { pre.textContent = JSON.stringify(doc, null, 2); })
    .catch(function (e) { pre.textContent = String(e); });
}

restoreFilters();   // zanim cokolwiek narysujemy — inaczej mignąłby domyślny widok
load(false);
</script>
</body>
</html>
