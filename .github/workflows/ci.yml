name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testy jednostkowe (padel)
        run: python3 -m unittest -v test_check_padel
      - name: Testy jednostkowe (czytnik tokenu)
        run: python3 -m unittest -v test_read_token
      - name: Testy jednostkowe (kino)
        run: python3 -m unittest -v test_check_cinema
      - name: Testy jednostkowe (panel)
        # Panel jest JEDYNYM miejscem, które potrafi anulować rezerwację, i jedynym
        # wystawionym przez Ingress. Do 0.24.0 nie miał ani jednego testu.
        run: python3 -m unittest -v test_panel
      - name: Nieokreślone nazwy
        # py_compile sprawdza SKŁADNIĘ. 04.09 na produkcji leciało co 30 s
        # NameError('cfg_startowy') — składnia poprawna, kod martwy.
        run: python3 sprawdz_nazwy.py padel_browser/check_padel.py padel_browser/panel.py padel_browser/read_token.py aws_remote/handler.py
      - name: Składnia silników
        run: python3 -m py_compile padel_browser/check_padel.py padel_browser/read_token.py padel_browser/panel.py cinema_watch/check_cinema.py
      - name: Paczka Lambdy jest aktualna
        # Wersjonowana paczka to plik, który użytkownik pobiera i wgrywa do AWS.
        # Gdyby rozjechała się ze źródłami, wgrałby STARY silnik i nie dowiedziałby
        # się o tym inaczej niż po przegranym terminie. Porównujemy ZAWARTOŚĆ,
        # nie bajty archiwum: zip niesie znaczniki czasu, więc bajty różnią się zawsze.
        run: |
          mkdir -p /tmp/zip-check
          unzip -q -o aws_remote/padel-remote.zip -d /tmp/zip-check
          diff -q /tmp/zip-check/handler.py aws_remote/handler.py
          diff -q /tmp/zip-check/check_padel.py padel_browser/check_padel.py
          echo "paczka zgodna ze źródłami"
